<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custmyze 3D & AR Viewer</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"></script>
  
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fafafa; font-family: sans-serif; }
    #main-viewer { width: 100%; height: 100vh; display: block; }
    
    /* واجهة الـ AR المخصصة */
    #ar-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: #000; }
    
    /* زرار قلب الكاميرا الشيك */
    #flip-cam-btn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9); border: none; padding: 12px 24px;
      border-radius: 30px; font-weight: bold; font-size: 14px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px;
      transition: 0.2s; z-index: 10000;
    }
    #flip-cam-btn:active { transform: translateX(-50%) scale(0.95); }
    
    /* زرار الإغلاق للعودة للمتجر */
    #close-ar-btn {
      position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6);
      color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%;
      font-size: 20px; cursor: pointer; z-index: 10000;
    }
  </style>
</head>
<body>

  <model-viewer id="main-viewer" camera-controls touch-action="pan-y" shadow-intensity="1"></model-viewer>
  
  <canvas id="texture-canvas" width="1024" height="1024" style="display:none;"></canvas>

  <div id="ar-container">
    <button id="close-ar-btn">✕</button>
    <button id="flip-cam-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      تبديل الكاميرا
    </button>
  </div>

  <script>
    const modelViewer = document.querySelector("#main-viewer");
    const canvas = document.getElementById("texture-canvas");
    const ctx = canvas.getContext("2d");
    
    let currentFacingMode = "user"; // البداية كاميرا أمامية لتجربة الكاب على الوجه
    let mindarThree = null;

    // استلام الرسائل من المتجر (تغيير موديل، لون، لوجو)
    window.addEventListener("message", async (event) => {
      const { type, value } = event.data;

      if (type === 'LOAD_PRODUCT_MODEL' && value) {
        if (modelViewer.src !== value) modelViewer.src = value;
        return;
      }

      if (type === 'UPDATE_COLOR') {
        await modelViewer.updateComplete;
        if (!modelViewer.model) return;
        const material = modelViewer.model.materials[0];
        if (material) {
          material.pbrMetallicRoughness.setBaseColorFactor([value.r, value.g, value.b, value.a]);
        }
        return;
      }

      if (type === 'UPDATE_TEXT') { redrawCanvas(value, null); return; }
      if (type === 'UPDATE_IMAGE') {
        const img = new Image();
        img.src = value;
        img.onload = () => redrawCanvas(null, img);
        return;
      }
    });

    // دالة حقن اللوجو والنص على الماتريال
    function redrawCanvas(text, bgImage) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (bgImage) ctx.drawImage(bgImage, 256, 256, 512, 512);
      if (text) {
        ctx.fillStyle = "#010101";
        ctx.font = "bold 50px Almarai, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(text, 512, 800);
      }
      if (modelViewer.model) {
        // البحث عن منطقة الطباعة المحددة في بلندر أو الماتريال الثانية
        const material = modelViewer.model.materials.find(m => m.name === 'printable_area') || modelViewer.model.materials[1];
        if (material) {
          modelViewer.createHTMLCanvasTexture(canvas).then((texture) => {
            material.pbrMetallicRoughness.baseColorTexture.setTexture(texture);
          });
        }
      }
    }

    // --- نظام الـ WebAR المتطور لتبديل الكاميرات ---
    
    async function startAR(mode) {
      const container = document.getElementById("ar-container");
      container.style.display = "block";
      
      // بناء مشهد الـ AR بناءً على الكاميرا المختارة
      mindarThree = new window.MINDAR.FACE.MindARThree({
        container: container,
        facingMode: mode // "user" للأمامية أو "environment" للخلفية
      });
      
      const {renderer, scene, camera} = mindarThree;
      
      // ربط الموديل الـ 3D بالوجه (الanchor رقم 10 يمثل الجبهة لكاب مضبوط)
      const anchor = mindarThree.addAnchor(10);
      
      // تجهيز موديل الـ GLB الحالي ليظهر في الكاميرا
      if (modelViewer.model) {
        const clonedModel = modelViewer.model.clone();
        clonedModel.scale.set(0.5, 0.5, 0.5); // ضبط المقاس ليناسب الرأس
        anchor.group.add(clonedModel);
      }

      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    }

    function stopAR() {
      if (mindarThree) {
        mindarThree.stop();
        const container = document.getElementById("ar-container");
        // تنظيف الكاميرا القديمة منعاً لتهنيج الموبايل
        const video = container.querySelector("video");
        if (video) video.remove();
        container.style.display = "none";
      }
    }

    // تشغيل زر التبديل بين الأمامية والخلفية
    document.getElementById("flip-cam-btn").addEventListener("click", async () => {
      stopAR();
      currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
      await startAR(currentFacingMode);
    });

    // زر إغلاق الـ AR والعودة للمتجر
    document.getElementById("close-ar-btn").addEventListener("click", () => {
      stopAR();
    });

    // استقبال أمر تفعيل الـ AR من زر خارجي في المتجر إذا أردت
    window.addEventListener("message", (e) => {
      if (e.data.type === 'START_AR_EXPERIENCE') {
        startAR(currentFacingMode);
      }
    });
  </script>
</body>
</html>
