<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fafafa; font-family: system-ui, sans-serif; }
    #main-viewer { width: 100%; height: 100vh; display: block; position: relative; }

    /* 🌟 شاشة التحميل الاحترافية بخلفية ضبابية */
    #custom-poster {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(250, 250, 250, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px); /* لدعم متصفحات آيفون وسفاري */
      display: flex; justify-content: center; align-items: center;
      z-index: 999; transition: opacity 0.5s ease;
    }
    
    /* الأنيميشن النبضي للوجو (يكبر ويصغر كأنه بيتنفّس) */
    .loading-logo {
      width: 100px; /* مقاس اللوجو في نص الشاشة */
      height: auto;
      object-fit: contain;
      animation: pulse-animation 1.5s ease-in-out infinite;
    }

    @keyframes pulse-animation {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    /* إخفاء الـ Progress Bar الافتراضي القديم */
    #main-viewer::part(default-progress-bar) { display: none; }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
</head>
<body>

  <model-viewer id="main-viewer" camera-controls touch-action="pan-y" shadow-intensity="1" ar>
    
    <div slot="poster" id="custom-poster">
      <img class="loading-logo" src="https://github.com/mhmd-slah/Custmyze/blob/bc205f6ddec0a381fc4054c60c3b806ca2c24c30/code/my.png" alt="Loading...">
    </div>

  </model-viewer>
  
  <canvas id="texture-canvas" width="1024" height="1024" style="display:none;"></canvas>

  <script>
    const modelViewer = document.querySelector("#main-viewer");
    const canvas = document.getElementById("texture-canvas");
    const ctx = canvas.getContext("2d");

    window.addEventListener("message", async (event) => {
      const { type, value } = event.data;

      // استقبال رابط موديل المنتج السادة وتحميله فوراً
      if (type === 'LOAD_PRODUCT_MODEL' && value) {
        if (modelViewer.src !== value) {
          modelViewer.src = value;
        }
        return;
      }

      // تغيير لون الموديل بالصبغة لايف
      if (type === 'UPDATE_COLOR') {
        await modelViewer.updateComplete;
        if (!modelViewer.model) return;
        
        const material = modelViewer.model.materials[0];
        if (material) {
          material.pbrMetallicRoughness.setBaseColorFactor([value.r, value.g, value.b, value.a]);
        }
        return;
      }

      // النصوص والصور للطباعة
      if (type === 'UPDATE_TEXT') { redrawCanvas(value, null); return; }
      if (type === 'UPDATE_IMAGE') {
        const img = new Image();
        img.src = value;
        img.onload = () => redrawCanvas(null, img);
        return;
      }
    });

    function redrawCanvas(text, bgImage) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (bgImage) ctx.drawImage(bgImage, 256, 256, 512, 512);
      if (text) {
        ctx.fillStyle = "#010101";
        ctx.font = "bold 50px Almarai, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(text, 512, 800);
      }
      if (modelViewer.model) {
        const material = modelViewer.model.materials.find(m => m.name === 'Print_Material') || modelViewer.model.materials[1];
        if (material) {
          modelViewer.createHTMLCanvasTexture(canvas).then((texture) => {
            material.pbrMetallicRoughness.baseColorTexture.setTexture(texture);
          });
        }
      }
    }
  </script>
</body>
</html>
